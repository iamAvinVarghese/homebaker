services:
  # Django Web Service
  - type: web
    name: homebaker
    env: python
    rootDir: homebaker
    buildCommand: "./build.sh"
    startCommand: "gunicorn homebaker.wsgi:application --bind 0.0.0.0:$PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homebaker-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: LEONARDO_API_KEY
        sync: false # Set in Render Dashboard
      - key: EMAIL_HOST_USER
        sync: false # Set in Render Dashboard
      - key: EMAIL_HOST_PASSWORD
        sync: false # Set in Render Dashboard
      - key: DEFAULT_FROM_EMAIL
        sync: false # Set in Render Dashboard

databases:
  # Managed PostgreSQL instance
  - name: homebaker-db
    plan: free
    databaseName: homebaker_db
    user: postgres
