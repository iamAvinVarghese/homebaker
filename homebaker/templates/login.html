{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

    .script-font {
        font-family: 'Great Vibes', cursive;
        font-weight: normal;
        letter-spacing: 1px;
    }

    /* Background Globs matching Home */
    .bg-glob-1 {
        position: fixed;
        top: -10%;
        left: -10%;
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, rgba(108, 30, 180, 0.2) 0%, rgba(7, 3, 10, 0) 60%);
        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
    }

    .bg-glob-2 {
        position: fixed;
        top: 40%;
        right: -20%;
        width: 900px;
        height: 900px;
        background: radial-gradient(circle, rgba(108, 30, 180, 0.15) 0%, rgba(7, 3, 10, 0) 60%);
        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
    }

    .content-wrapper {
        position: relative;
        z-index: 1;
        min-height: calc(100vh - 200px);
    }

    .gold-text { color: #ebd197 !important; }
    .text-muted-premium { color: #94a3b8 !important; }

    /* Force dark theme */
    body {
        background-color: #07030a !important;
        color: #ffffff !important;
    }

    /* Premium Cards */
    .premium-card {
        background-color: rgba(30, 20, 40, 0.4) !important;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(235, 209, 151, 0.15) !important;
        border-radius: 20px;
        color: #ffffff;
        box-shadow: 0 15px 45px rgba(0,0,0,0.4);
    }

    /* Form Controls Override */
    .form-control {
        background-color: rgba(0, 0, 0, 0.3) !important;
        border: 1px solid rgba(235, 209, 151, 0.1) !important;
        color: #ffffff !important;
        padding: 0.75rem 1.25rem;
        border-radius: 12px;
    }
    .form-control:focus {
        background-color: rgba(0, 0, 0, 0.5) !important;
        border-color: #ebd197 !important;
        box-shadow: 0 0 0 0.25rem rgba(235, 209, 151, 0.1) !important;
    }
    .form-label {
        color: #ebd197;
        font-weight: 500;
        margin-bottom: 0.5rem;
    }

    .nav-tabs {
        border-bottom: 1px solid rgba(235, 209, 151, 0.1) !important;
    }
    .nav-tabs .nav-link {
        color: #94a3b8;
        border: none !important;
        border-bottom: 3px solid transparent !important;
        transition: all 0.3s ease;
        background: transparent !important;
    }
    .nav-tabs .nav-link.active {
        color: #ebd197 !important;
        border-bottom: 3px solid #ebd197 !important;
    }

    .btn-theme-purple {
        background: linear-gradient(135deg, #4a1c6a, #2b1040);
        color: white;
        border: 1px solid rgba(235, 209, 151, 0.3);
        border-radius: 50px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(74, 28, 106, 0.4);
        font-weight: 600;
        padding: 0.8rem;
    }
    .btn-theme-purple:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(74, 28, 106, 0.6);
        border-color: #ebd197;
        color: white;
    }

    .btn-toggle-eye {
        background-color: rgba(235, 209, 151, 0.1) !important;
        border-color: rgba(235, 209, 151, 0.1) !important;
        color: #ebd197 !important;
        border-radius: 0 12px 12px 0 !important;
    }
</style>

<div class="bg-glob-1"></div>
<div class="bg-glob-2"></div>

<div class="content-wrapper">
    <div class="row justify-content-center pt-5">
        <div class="col-md-5">
            <div class="text-center mb-5">
                <h2 class="script-font gold-text" style="font-size: 4rem; text-shadow: 0 0 15px rgba(235, 209, 151, 0.2);">Welcome Back</h2>
                <p class="text-muted-premium" style="letter-spacing: 1px;">SIGN IN TO YOUR ACCOUNT</p>
            </div>

            <div class="card premium-card border-0">
                <div class="card-header bg-transparent border-0 p-0">
                    <ul class="nav nav-tabs nav-fill mb-0" id="loginTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active py-3 fw-semibold" id="password-tab" data-bs-toggle="tab"
                                data-bs-target="#password-login" type="button" role="tab">
                                Password Login
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link py-3 fw-semibold" id="otp-tab" data-bs-toggle="tab"
                                data-bs-target="#otp-login" type="button" role="tab">
                                OTP Login
                            </button>
                        </li>
                    </ul>
                </div>

                <div class="card-body p-4 p-md-5 tab-content" id="loginTabContent">
                    <!-- PASSWORD LOGIN -->
                    <div class="tab-pane fade show active" id="password-login" role="tabpanel">
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-4">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" name="phone_number" class="form-control"
                                    placeholder="Enter phone number" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" name="password" id="id_password"
                                        class="form-control" style="border-radius: 12px 0 0 12px !important;" required>
                                    <button class="btn btn-toggle-eye d-flex align-items-center justify-content-center" type="button" id="togglePassword" style="width: 45px;">
                                        <i class="fas fa-eye eye-open"></i>
                                        <i class="fas fa-eye-slash eye-closed" style="display:none;"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-theme-purple w-100 btn-lg mt-3">
                                <i class="fas fa-sign-in-alt me-2"></i> Login
                            </button>
                        </form>
                    </div>

                    <!-- OTP LOGIN -->
                    <div class="tab-pane fade" id="otp-login" role="tabpanel">
                        <div id="otp-request-section">
                            <div class="mb-4">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" id="otp_phone_number" class="form-control"
                                    placeholder="Enter registered phone number">
                            </div>
                            <button type="button" id="sendOtpBtn" class="btn btn-theme-purple w-100 btn-lg">
                                <i class="fas fa-paper-plane me-2"></i> Send OTP to Email
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-5">
                        <p class="text-muted-premium mb-0">
                            Don't have an account? <a href="{% url 'register' %}" class="gold-text fw-bold text-decoration-none ms-1" style="font-size: inherit; vertical-align: baseline;">Register here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('id_password');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);

                const openIcon = this.querySelector('.eye-open');
                const closedIcon = this.querySelector('.eye-closed');
                
                if (type === 'text') {
                    openIcon.style.display = 'none';
                    closedIcon.style.display = 'block';
                } else {
                    openIcon.style.display = 'block';
                    closedIcon.style.display = 'none';
                }
            });
        }

        // OTP Notification helper for Login
        function showNotification(message, type) {
            const container = document.getElementById('alert-container');
            if (!container) return;
            
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show mt-3 shadow-sm border-0 message-alert-custom" role="alert" data-tag="${type}">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', alertHtml);
            
            // Auto fade out logic
            setTimeout(function() {
                const newAlert = container.lastElementChild;
                if (newAlert) {
                    newAlert.classList.add('alert-fade-out');
                    setTimeout(() => newAlert.remove(), 800);
                }
            }, 5000);
        }

        // OTP Login Logic
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const otpPhoneInput = document.getElementById('otp_phone_number');

        if (sendOtpBtn && otpPhoneInput) {
            sendOtpBtn.addEventListener('click', function () {
                const phone = otpPhoneInput.value;
                if (!phone) {
                    showNotification('Please enter your phone number.', 'warning');
                    return;
                }

                sendOtpBtn.disabled = true;
                sendOtpBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Sending...';

                const formData = new FormData();
                formData.append('phone_number', phone);
                formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

                fetch('{% url "send_login_otp" %}', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            sessionStorage.setItem('otp_sent_message', data.message);
                            window.location.href = '{% url "verify_otp" %}';
                        } else {
                            showNotification(data.message, 'danger');
                            sendOtpBtn.disabled = false;
                            sendOtpBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i> Send OTP to Email';
                        }
                    })
                    .catch(error => {
                        showNotification('Error: ' + error, 'danger');
                        sendOtpBtn.disabled = false;
                        sendOtpBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i> Send OTP to Email';
                    });
            });
        }
    });
</script>

{% endblock %}
