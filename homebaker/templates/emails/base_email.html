<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #030105;
            color: #e2e8f0;
        }
        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #030105;
            padding: 40px 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #07030a;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #332a1a;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .content {
            padding: 40px 30px;
            line-height: 1.8;
            color: #cbd5e1;
        }
        .content h2 {
            margin-top: 0;
            color: #ebd197;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .footer {
            padding: 30px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            background-color: #030105;
            border-top: 1px solid #1a150e;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #ebd197 0%, #c5a66a 100%);
            color: #07030a !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 800;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }
        .otp-box {
            display: inline-block;
            background-color: rgba(235, 209, 151, 0.05);
            border: 1px solid #ebd197;
            padding: 25px 50px;
            border-radius: 16px;
            font-size: 40px;
            font-weight: 800;
            color: #ebd197;
            letter-spacing: 8px;
            margin: 30px 0;
            text-shadow: 0 0 15px rgba(235, 209, 151, 0.3);
            font-family: 'Inter', sans-serif;
        }
        .detail-card {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(235, 209, 151, 0.1);
            border-radius: 16px;
            padding: 25px;
            margin: 25px 0;
        }
        .detail-row {
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
        }
        .detail-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .detail-label {
            font-weight: 700;
            color: #ebd197;
            display: inline-block;
            width: 140px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .detail-value {
            color: #e2e8f0;
            font-weight: 500;
        }
        .text-gold { color: #ebd197; }
        .text-success { color: #10b981; }
        .text-danger { color: #ef4444; }
        
        .script-font {
            font-family: 'Great Vibes', cursive;
            color: #ebd197;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="content">
                {% block content %}
                {% endblock %}
            </div>
            <div class="footer">
                <p style="margin-bottom: 5px;">&copy; 2026 <span class="text-gold" style="font-weight: 700;">HomeBaker</span> Artisan Collective</p>
                <p>Crafting Exquisite Moments, One Cake at a Time.</p>
                <div style="margin-top: 20px;">
                    <a href="#" style="color: #ebd197; text-decoration: none; margin: 0 10px;">Instagram</a>
                    <a href="#" style="color: #ebd197; text-decoration: none; margin: 0 10px;">Website</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
