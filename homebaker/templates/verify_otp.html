{% extends 'base.html' %}
{% block title %}Verify OTP{% endblock %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

    .script-font {
        font-family: 'Great Vibes', cursive;
        font-weight: normal;
        letter-spacing: 1px;
    }

    /* Background Globs matching Home */
    .bg-glob-1 {
        position: fixed;
        top: -10%;
        left: -10%;
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, rgba(108, 30, 180, 0.2) 0%, rgba(7, 3, 10, 0) 60%);
        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
    }

    .bg-glob-2 {
        position: fixed;
        top: 40%;
        right: -20%;
        width: 900px;
        height: 900px;
        background: radial-gradient(circle, rgba(108, 30, 180, 0.15) 0%, rgba(7, 3, 10, 0) 60%);
        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
    }

    .content-wrapper {
        position: relative;
        z-index: 1;
        min-height: calc(100vh - 200px);
    }

    .gold-text { color: #ebd197 !important; }
    .text-muted-premium { color: #94a3b8 !important; }

    /* Force dark theme */
    body {
        background-color: #07030a !important;
        color: #ffffff !important;
    }

    /* Premium Cards */
    .premium-card {
        background-color: rgba(30, 20, 40, 0.4) !important;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(235, 209, 151, 0.15) !important;
        border-radius: 20px;
        color: #ffffff;
        box-shadow: 0 15px 45px rgba(0,0,0,0.4);
    }

    /* Form Controls Override */
    .form-control {
        background-color: rgba(0, 0, 0, 0.3) !important;
        border: 1px solid rgba(235, 209, 151, 0.1) !important;
        color: #ffffff !important;
        border-radius: 12px;
    }
    .form-control:focus {
        background-color: rgba(0, 0, 0, 0.5) !important;
        border-color: #ebd197 !important;
        box-shadow: 0 0 0 0.25rem rgba(235, 209, 151, 0.1) !important;
    }

    .btn-theme-purple {
        background: linear-gradient(135deg, #4a1c6a, #2b1040);
        color: white;
        border: 1px solid rgba(235, 209, 151, 0.3);
        border-radius: 50px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(74, 28, 106, 0.4);
        font-weight: 600;
        padding: 0.8rem;
    }
    .btn-theme-purple:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(74, 28, 106, 0.6);
        border-color: #ebd197;
        color: white;
    }

    .otp-input {
        letter-spacing: 0.5rem;
        font-size: 2.5rem;
        height: auto;
        padding: 1rem;
        background: rgba(235, 209, 151, 0.05) !important;
        border-color: rgba(235, 209, 151, 0.2) !important;
        color: #ebd197 !important;
        text-shadow: 0 0 10px rgba(235, 209, 151, 0.2);
    }

    .btn-link-gold {
        color: #ebd197;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    .btn-link-gold:hover {
        color: #ffffff;
        text-shadow: 0 0 10px rgba(235, 209, 151, 0.5);
    }
</style>

<div class="bg-glob-1"></div>
<div class="bg-glob-2"></div>

<div class="content-wrapper">
    <div class="row justify-content-center pt-5">
        <div class="col-md-5">
            <div class="text-center mb-5">
                <h2 class="script-font gold-text" style="font-size: 4rem; text-shadow: 0 0 15px rgba(235, 209, 151, 0.2);">Verify OTP</h2>
                <p class="text-muted-premium" style="letter-spacing: 1px;">ENTER THE 6-DIGIT CODE SENT TO YOUR EMAIL</p>
            </div>

            <div class="card premium-card border-0 p-4 p-md-5">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-5">
                        <label class="form-label gold-text fw-bold text-center d-block mb-3" style="letter-spacing: 2px;">OTP CODE</label>
                        <input type="text" name="otp" class="form-control otp-input text-center fw-bold"
                            placeholder="000000" maxlength="6" pattern="\d{6}" required autofocus>
                    </div>

                    <button type="submit" class="btn btn-theme-purple w-100 btn-lg mb-4">
                        <i class="fas fa-check-circle me-2"></i> Verify & Continue
                    </button>
                </form>

                <div class="text-center">
                    <p class="text-muted-premium small mb-2">Didn't receive the code?</p>
                    <button id="resendBtn" class="btn btn-link-gold p-0 border-0 bg-transparent">Resend OTP</button>
                    <div id="resendMessage" class="small mt-2"></div>
                </div>

                <div class="text-center mt-4 pt-4 border-top" style="border-color: rgba(235, 209, 151, 0.1) !important;">
                    <a href="{% url 'login' %}" class="text-muted-premium text-decoration-none small hover-gold">
                        <i class="fas fa-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function showNotification(message, type) {
        const container = document.getElementById('alert-container');
        if (!container) return;
        
        const alertHtml = `
            <div class="alert alert-${type} alert-dismissible fade show mt-3 shadow-sm border-0 message-alert-custom" role="alert" data-tag="${type}">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', alertHtml);
        
        setTimeout(function() {
            const newAlert = container.lastElementChild;
            if (newAlert) {
                newAlert.classList.add('alert-fade-out');
                setTimeout(() => newAlert.remove(), 800);
            }
        }, 5000);
    }

    document.addEventListener('DOMContentLoaded', function() {
        const otpMessage = sessionStorage.getItem('otp_sent_message');
        if (otpMessage) {
            showNotification(otpMessage, 'success');
            sessionStorage.removeItem('otp_sent_message');
        }
    });

    document.getElementById('resendBtn').addEventListener('click', function (e) {
        e.preventDefault();
        const btn = this;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Sending...';

        fetch('{% url "resend_otp" %}')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showNotification(data.message, 'success');
                    let timeLeft = 60;
                    const interval = setInterval(() => {
                        timeLeft--;
                        btn.innerText = 'Resend in ' + timeLeft + 's';
                        if (timeLeft <= 0) {
                            clearInterval(interval);
                            btn.disabled = false;
                            btn.innerText = 'Resend OTP';
                        }
                    }, 1000);
                } else {
                    showNotification(data.message, 'danger');
                    btn.disabled = false;
                    btn.innerText = 'Resend OTP';
                }
            })
            .catch(error => {
                showNotification('Error: ' + error, 'danger');
                btn.disabled = false;
                btn.innerText = 'Resend OTP';
            });
    });
</script>
<style>
    .hover-gold:hover { color: #ebd197 !important; }
</style>
{% endblock %}
