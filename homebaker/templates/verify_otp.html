{% extends 'base.html' %}
{% block title %}Verify OTP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold mb-2" style="color: var(--text-primary);">Verify OTP</h2>
            <p class="text-muted">Enter the 6-digit code sent to your email</p>
        </div>

        <div class="card border-0 shadow-sm p-4 p-md-5">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-semibold mb-2 text-center d-block">OTP Code</label>
                    <input type="text" name="otp" class="form-control form-control-lg text-center fw-bold"
                        placeholder="000000" maxlength="6" pattern="\d{6}" required autofocus
                        style="letter-spacing: 0.5rem; font-size: 2rem;">
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    Verify & Continue
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted small mb-2">Didn't receive the code?</p>
                <button id="resendBtn" class="btn btn-link text-decoration-none p-0">Resend OTP</button>
                <div id="resendMessage" class="small mt-2"></div>
            </div>

            <div class="text-center mt-4 pt-3 border-top">
                <a href="{% url 'login' %}" class="text-decoration-none small">Back to Login</a>
            </div>
        </div>
    </div>
</div>

<script>
    function showNotification(message, type) {
        const container = document.getElementById('alert-container');
        if (!container) return;
        
        const alertHtml = `
            <div class="alert alert-${type} alert-dismissible fade show mt-3 shadow-sm border-0 message-alert-custom" role="alert" data-tag="${type}">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', alertHtml);
        
        // Auto fade out logic (replicated from base.html for dynamic alerts)
        setTimeout(function() {
            const newAlert = container.lastElementChild;
            if (newAlert) {
                newAlert.classList.add('alert-fade-out');
                setTimeout(() => newAlert.remove(), 800);
            }
        }, 5000);
    }

    // Check for success message from login page
    document.addEventListener('DOMContentLoaded', function() {
        const otpMessage = sessionStorage.getItem('otp_sent_message');
        if (otpMessage) {
            showNotification(otpMessage, 'success');
            sessionStorage.removeItem('otp_sent_message');
        }
    });

    document.getElementById('resendBtn').addEventListener('click', function (e) {
        e.preventDefault();
        const btn = this;
        const msgDiv = document.getElementById('resendMessage');

        btn.disabled = true;
        btn.innerText = 'Sending...';

        fetch('{% url "resend_otp" %}')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showNotification(data.message, 'success');
                    // Cool-down for 60 seconds
                    let timeLeft = 60;
                    const interval = setInterval(() => {
                        timeLeft--;
                        btn.innerText = 'Resend in ' + timeLeft + 's';
                        if (timeLeft <= 0) {
                            clearInterval(interval);
                            btn.disabled = false;
                            btn.innerText = 'Resend OTP';
                        }
                    }, 1000);
                } else {
                    showNotification(data.message, 'danger');
                    btn.disabled = false;
                    btn.innerText = 'Resend OTP';
                }
            })
            .catch(error => {
                showNotification('Error: ' + error, 'danger');
                btn.disabled = false;
                btn.innerText = 'Resend OTP';
            });
    });
</script>
{% endblock %}
