{% load static %}
<!-- Chat Widget Container -->
<div id="chat-widget" class="chat-widget">
    <!-- Welcome Bubble Pop-up -->
    <div id="chat-welcome-bubble" class="chat-welcome-bubble d-none">
        <div class="bubble-content text-center">
            Hello, I'm <span class="gold-shimmer fw-bold" style="font-size: 0.95rem; letter-spacing: 0.5px;">Ana AI</span>. How may I assist you?
        </div>
        <div class="bubble-arrow"></div>
    </div>

    <!-- Floating Button -->
    <button id="chat-toggle-btn" class="chat-toggle-btn luxury-fab" aria-label="Open Chat">
        <div class="position-relative">
            <i class="fas fa-sparkles chat-sparkle"></i>
            <i class="fas fa-comment-dots" style="font-size: 28px; z-index: 2;"></i>
        </div>
    </button>

    <!-- Chat Window -->
    <div id="chat-window" class="chat-window-luxury d-none">
        <!-- Header -->
        <div class="chat-header-premium p-3 text-center position-relative">
            <button id="chat-close-btn" class="chat-close-btn" aria-label="Close Chat">
                <i class="fas fa-times"></i>
            </button>
            <div class="mb-1">
                <i class="fas fa-birthday-cake gold-shimmer" style="font-size: 1.2rem;"></i>
            </div>
            <h4 class="script-font gold-shimmer mb-0" style="font-size: 2rem;">Confectionery Concierge</h4>
            <small class="text-white-50 d-block xsmall fw-bold" style="letter-spacing: 1px; text-transform: uppercase;">Powered by <span class="gold-shimmer fw-bold" style="font-size: 0.85rem; text-transform: none; letter-spacing: 0.5px;">Ana AI</span></small>
        </div>

        <!-- Messages Area -->
        <div id="chat-messages" class="chat-messages-premium px-3 pb-3">
            <!-- Initial Welcome Messages -->
            <div class="message bot-message mb-3 d-flex align-items-start">
                <div class="bot-avatar-premium me-2">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <div>
                    <small class="d-block mb-1 gold-shimmer fw-bold" style="font-size: 0.75rem; letter-spacing: 0.5px;">Ana AI</small>
                    <div class="message-content-premium p-3">
                        Greetings. I am Ana, your personal concierge. How can I help you explore our collection or track your orders today?
                    </div>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="px-4 pb-2 d-none">
            <div class="typing-indicator-luxury">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-premium p-3">
            <div class="input-wrapper-luxury">
                <input type="text" id="chat-input-field" class="chat-input-field" placeholder='Inquire about order #12345...' aria-label="Inquire">
                <button id="chat-send-btn" class="chat-send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

    .script-font {
        font-family: 'Great Vibes', cursive !important;
    }

    .classic-font {
        font-family: 'Cinzel', serif !important;
        letter-spacing: 1px;
    }

    .chat-widget {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 2000;
        font-family: 'Inter', sans-serif;
    }

    /* Floating Action Button */
    .luxury-fab {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #2a1b3d, #07030a);
        border: 2px solid rgba(235, 209, 151, 0.5);
        color: #ebd197;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        animation: luxury-glow 3s infinite ease-in-out;
    }

    @keyframes luxury-glow {
        0% { 
            box-shadow: 0 0 15px rgba(235, 209, 151, 0.2), 
                        inset 0 0 10px rgba(235, 209, 151, 0.1),
                        0 0 5px rgba(0,0,0,0.5); 
            border-color: rgba(235, 209, 151, 0.4);
        }
        50% { 
            box-shadow: 0 0 35px rgba(235, 209, 151, 0.6), 
                        inset 0 0 20px rgba(235, 209, 151, 0.2),
                        0 0 10px rgba(235, 209, 151, 0.3);
            border-color: rgba(235, 209, 151, 0.8);
            transform: scale(1.02);
        }
        100% { 
            box-shadow: 0 0 15px rgba(235, 209, 151, 0.2), 
                        inset 0 0 10px rgba(235, 209, 151, 0.1),
                        0 0 5px rgba(0,0,0,0.5);
            border-color: rgba(235, 209, 151, 0.4);
        }
    }

    .luxury-fab:hover {
        transform: translateY(-8px) scale(1.1) !important;
        box-shadow: 0 20px 50px rgba(235, 209, 151, 0.4), inset 0 0 25px rgba(235, 209, 151, 0.3) !important;
        border-color: #ebd197 !important;
    }

    .chat-sparkle {
        position: absolute;
        top: -12px;
        right: -12px;
        color: #ebd197;
        font-size: 1.3rem;
        filter: drop-shadow(0 0 5px #ebd197);
        animation: sparkle-float 2.5s infinite ease-in-out;
    }

    @keyframes sparkle-float {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.6; }
        50% { transform: scale(1.4) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 8px #ebd197); }
    }

    /* Welcome Bubble */
    .chat-welcome-bubble {
        position: absolute;
        bottom: 10px;
        right: 80px;
        width: 240px;
        background: rgba(7, 3, 10, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(235, 209, 151, 0.3);
        border-radius: 20px;
        padding: 12px 18px;
        color: #fff;
        font-size: 0.85rem;
        box-shadow: 0 15px 45px rgba(0,0,0,0.6);
        z-index: 1999;
        opacity: 0;
        transform: translateX(20px);
        transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .chat-welcome-bubble.show {
        opacity: 1;
        transform: translateX(0);
    }

    .bubble-arrow {
        position: absolute;
        bottom: 25px;
        right: -8px;
        width: 16px;
        height: 16px;
        background: rgba(7, 3, 10, 0.95);
        border-right: 1px solid rgba(235, 209, 151, 0.3);
        border-top: 1px solid rgba(235, 209, 151, 0.3);
        transform: rotate(45deg);
    }

    /* Chat Window */
    .chat-window-luxury {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 340px;
        height: 480px;
        background: rgba(15, 10, 20, 0.65);
        backdrop-filter: blur(45px);
        -webkit-backdrop-filter: blur(45px);
        border: 1px solid rgba(235, 209, 151, 0.2);
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 25px 80px rgba(0,0,0,0.8), inset 0 0 30px rgba(235, 209, 151, 0.05);
        transform-origin: bottom right;
        transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .chat-window-luxury.d-none {
        display: none !important;
        opacity: 0;
        transform: scale(0.9) translateY(20px);
    }

    .chat-header-premium {
        background: linear-gradient(180deg, rgba(235, 209, 151, 0.08) 0%, transparent 100%);
        border-bottom: 1px solid rgba(235, 209, 151, 0.1);
    }

    .chat-close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.6);
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        font-size: 0.8rem;
    }

    .chat-close-btn:hover {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
        border-color: rgba(239, 68, 68, 0.4);
    }

    .chat-messages-premium {
        flex: 1;
        overflow-y: auto;
        padding-top: 15px;
    }

    .chat-messages-premium::-webkit-scrollbar {
        width: 3px;
    }

    .chat-messages-premium::-webkit-scrollbar-thumb {
        background: rgba(235, 209, 151, 0.2);
        border-radius: 10px;
    }

    .message-content-premium {
        font-size: 0.85rem;
        line-height: 1.5;
        border-radius: 18px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        position: relative;
    }

    .bot-message .message-content-premium {
        background: rgba(255, 255, 255, 0.08);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-top-left-radius: 4px;
        animation: slideInLeft 0.4s ease-out;
    }

    .user-message .message-content-premium {
        background: linear-gradient(135deg, rgba(235, 209, 151, 0.2), rgba(235, 209, 151, 0.1));
        color: #fff;
        border: 1px solid rgba(235, 209, 151, 0.2);
        border-top-right-radius: 4px;
        animation: slideInRight 0.4s ease-out;
    }

    @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideInRight {
        from { opacity: 0; transform: translateX(10px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .bot-avatar-premium {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: linear-gradient(135deg, #ebd197, #c5a059);
        color: #07030a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        box-shadow: 0 0 12px rgba(235, 209, 151, 0.3);
        flex-shrink: 0;
    }

    /* Input Area */
    .chat-input-premium {
        background: rgba(0, 0, 0, 0.2);
        border-top: 1px solid rgba(235, 209, 151, 0.1);
    }

    .input-wrapper-luxury {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(235, 209, 151, 0.2);
        border-radius: 50px;
        padding: 4px 4px 4px 18px;
        display: flex;
        align-items: center;
        transition: all 0.3s ease;
    }

    .input-wrapper-luxury:focus-within {
        background: rgba(255, 255, 255, 0.08);
        border-color: #ebd197;
        box-shadow: 0 0 15px rgba(235, 209, 151, 0.1);
    }

    .chat-input-field {
        background: transparent;
        border: none;
        color: #fff;
        flex: 1;
        font-size: 0.85rem;
        padding: 8px 0;
    }

    .chat-input-field:focus {
        outline: none;
    }

    .chat-send-btn {
        background: #ebd197;
        color: #07030a;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: 10px;
        transition: all 0.3s ease;
        cursor: pointer;
        font-size: 0.9rem;
    }

    .chat-send-btn:hover {
        transform: scale(1.1) rotate(-10deg);
        background: #f5e1b2;
    }

    /* Typing Indicator */
    .typing-indicator-luxury {
        display: flex;
        gap: 4px;
    }

    .typing-indicator-luxury span {
        width: 6px;
        height: 6px;
        background: #ebd197;
        border-radius: 50%;
        opacity: 0.3;
        animation: typing-bounce 1.4s infinite ease-in-out both;
    }

    .typing-indicator-luxury span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator-luxury span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing-bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1.0); opacity: 0.8; }
    }

    @media (max-width: 500px) {
        .chat-window-luxury {
            width: calc(100vw - 40px);
            right: -10px;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggleBtn = document.getElementById('chat-toggle-btn');
        const closeBtn = document.getElementById('chat-close-btn');
        const chatWindow = document.getElementById('chat-window');
        const inputField = document.getElementById('chat-input-field');
        const sendBtn = document.getElementById('chat-send-btn');
        const messagesContainer = document.getElementById('chat-messages');
        const typingIndicator = document.getElementById('typing-indicator');
        const welcomeBubble = document.getElementById('chat-welcome-bubble');

        const hasShownBubble = sessionStorage.getItem('chat_bubble_shown');
        const path = window.location.pathname;
        const isEntryPage = path === '/' || path.includes('/login/') || path.includes('/register/');

        if (!hasShownBubble || isEntryPage) {
            setTimeout(() => {
                if (chatWindow.classList.contains('d-none')) {
                    welcomeBubble.classList.remove('d-none');
                    setTimeout(() => welcomeBubble.classList.add('show'), 10);
                    sessionStorage.setItem('chat_bubble_shown', 'true');
                    
                    setTimeout(() => {
                        if (!welcomeBubble.classList.contains('d-none')) {
                            welcomeBubble.classList.remove('show');
                            setTimeout(() => welcomeBubble.classList.add('d-none'), 600);
                        }
                    }, 6000);
                }
            }, 2000);
        }

        function toggleChat() {
            const isHidden = chatWindow.classList.contains('d-none');
            if (isHidden) {
                chatWindow.classList.remove('d-none');
                welcomeBubble.classList.add('d-none');
                inputField.focus();
                scrollToBottom();
            } else {
                chatWindow.classList.add('d-none');
            }
        }

        toggleBtn.addEventListener('click', toggleChat);
        closeBtn.addEventListener('click', toggleChat);

        function sendMessage() {
            const message = inputField.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            inputField.value = '';

            typingIndicator.classList.remove('d-none');
            scrollToBottom();

            fetch('/chatbot/api/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    message: message,
                    history: []
                })
            })
            .then(res => res.json())
            .then(data => {
                typingIndicator.classList.add('d-none');
                addMessage(data.response, 'bot');
            })
            .catch(() => {
                typingIndicator.classList.add('d-none');
                addMessage("I apologize, but my connection is briefly interrupted. Please try again.", 'bot');
            });
        }

        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message mb-3 d-flex align-items-start`;
            if (sender === 'user') messageDiv.classList.add('justify-content-end');

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content-premium p-3';

            const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                                      .replace(/\n/g, '<br>');
            contentDiv.innerHTML = formattedText;

            if (sender === 'bot') {
                const avatar = document.createElement('div');
                avatar.className = 'bot-avatar-premium me-2';
                avatar.innerHTML = '<i class="fas fa-comment-dots"></i>';
                
                const wrapper = document.createElement('div');
                const label = document.createElement('small');
                label.className = 'd-block mb-1 gold-shimmer fw-bold';
                label.style.fontSize = '0.75rem';
                label.style.letterSpacing = '0.5px';
                label.innerText = 'Ana AI';
                
                wrapper.appendChild(label);
                wrapper.appendChild(contentDiv);
                
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(wrapper);
            } else {
                messageDiv.appendChild(contentDiv);
            }

            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    });
</script>
