{% load static %}
<!-- Chat Widget Container -->
<div id="chat-widget" class="chat-widget">
    <!-- Floating Button -->
    <button id="chat-toggle-btn" class="chat-toggle-btn shadow-lg" aria-label="Open Chat">
        <i class="fas fa-robot"></i>
    </button>

    <!-- Speech Bubble (Popup) -->
    <div id="chat-popup" class="chat-popup shadow-sm d-none">
        <div class="popup-content">
            Hello! I am Ammini AI, your virtual assistant. How can I help you today?
        </div>
        <div class="popup-arrow"></div>
    </div>

    <!-- Chat Window -->
    <div id="chat-window" class="chat-window shadow-lg d-none">
        <!-- Header -->
        <div class="chat-header text-white p-3 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <i class="fas fa-robot me-2"></i>
                <div>
                    <h6 class="mb-0 fw-bold">Ammini AI</h6>
                    <small class="text-white-50" style="font-size: 0.75rem;">Online</small>
                </div>
            </div>
            <button id="chat-close-btn" class="btn btn-sm text-white" aria-label="Close Chat">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Messages Area -->
        <div id="chat-messages" class="chat-messages p-3">
            <!-- Welcome Message (Internal) -->
            <div class="message bot-message mb-3">
                <div class="message-content p-2 px-3 rounded shadow-sm">
                    Hello! I am Ammini AI, your virtual assistant. How can I help you today?
                </div>
                <small class="text-muted ms-1" style="font-size: 0.7rem;">Just now</small>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="px-3 pb-2 d-none">
            <small class="text-muted"><i class="fas fa-circle-notch fa-spin me-1"></i> AI is typing...</small>
        </div>

        <!-- Input Area -->
        <div class="chat-input p-2 border-top bg-light">
            <div class="input-group">
                <input type="text" id="chat-input-field" class="form-control border-0" placeholder="Type a message..."
                    aria-label="Type a message">
                <button id="chat-send-btn" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    /* Chat Widget Styles */
    .chat-widget {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1050;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Speech Bubble Popup */
    .chat-popup {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 250px;
        background-color: white;
        padding: 15px;
        border-radius: 15px;
        border-bottom-right-radius: 5px;
        margin-bottom: 10px;
        animation: floatIn 0.5s ease-out;
        border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .popup-content {
        font-size: 0.9rem;
        color: #2d3436;
        line-height: 1.4;
    }

    /* Close button for popup (optional, but auto-close is requested) */

    [data-theme="dark"] .chat-popup {
        background-color: #2d2d2d;
        color: white;
        border-color: #404040;
    }

    [data-theme="dark"] .popup-content {
        color: white;
    }

    @keyframes floatIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes floatOut {
        from {
            opacity: 1;
            transform: translateY(0);
        }

        to {
            opacity: 0;
            transform: translateY(10px);
        }
    }

    .chat-popup.fade-out {
        animation: floatOut 0.5s ease-in forwards;
    }

    /* Floating Button */
    .chat-toggle-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background-color: #6c5ce7;
        color: white;
        border: none;
        font-size: 24px;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
    }

    .chat-toggle-btn:hover {
        transform: scale(1.1);
        background-color: #5b4bc4;
    }

    /* Chat Window */
    .chat-window {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 350px;
        height: 500px;
        background-color: #fff;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: opacity 0.3s ease, transform 0.3s ease;
        transform-origin: bottom right;
    }

    [data-theme="dark"] .chat-window {
        background-color: #2d2d2d;
        border: 1px solid #404040;
    }

    .chat-window.d-none {
        display: none !important;
    }

    /* Header */
    .chat-header {
        background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    }

    /* Messages Area */
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        background-color: #f8f9fa;
        display: flex;
        flex-direction: column;
    }

    [data-theme="dark"] .chat-messages {
        background-color: #1a1a1a;
    }

    /* Scrollbar styling */
    .chat-messages::-webkit-scrollbar {
        width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
        background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.1);
        border-radius: 3px;
    }

    /* Message Bubbles */
    .message {
        max-width: 80%;
        margin-bottom: 10px;
        word-wrap: break-word;
    }

    .message-content {
        font-size: 0.95rem;
        line-height: 1.4;
    }

    .bot-message {
        align-self: flex-start;
    }

    .bot-message .message-content {
        background-color: #fff;
        color: #2d3436;
        border-bottom-left-radius: 2px;
    }

    [data-theme="dark"] .bot-message .message-content {
        background-color: #3d3d3d;
        color: #fff;
    }

    .user-message {
        align-self: flex-end;
    }

    .user-message .message-content {
        background-color: #6c5ce7;
        color: white;
        border-bottom-right-radius: 2px;
    }

    /* Input Area */
    .chat-input {
        background-color: #fff;
    }

    [data-theme="dark"] .chat-input {
        background-color: #2d2d2d;
        border-top: 1px solid #404040 !important;
    }

    [data-theme="dark"] #chat-input-field {
        background-color: #3d3d3d;
        color: white;
    }

    [data-theme="dark"] #chat-input-field::placeholder {
        color: #aaa;
    }

    /* Mobile Responsiveness */
    @media (max-width: 576px) {
        .chat-window {
            width: calc(100vw - 40px);
            height: 60vh;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const chatWidget = document.getElementById('chat-widget');
        const toggleBtn = document.getElementById('chat-toggle-btn');
        const closeBtn = document.getElementById('chat-close-btn');
        const chatWindow = document.getElementById('chat-window');
        const sendBtn = document.getElementById('chat-send-btn');
        const inputField = document.getElementById('chat-input-field');
        const messagesContainer = document.getElementById('chat-messages');
        const typingIndicator = document.getElementById('typing-indicator');
        const chatPopup = document.getElementById('chat-popup');

        // POPUP LOGIC: Show speech bubble on home page load
        // Check if we are on the home page (root '/' or 'home')
        // OR simply show it once per session if preferred. user said "while entring to home page".
        const currentPath = window.location.pathname;
        const isHomePage = currentPath === '/' || currentPath === '/home/' || currentPath.endsWith('home.html');

        // Show popup if on home page and chat window is closed
        if (isHomePage && chatWindow.classList.contains('d-none')) {
            // Delay slightly for effect
            setTimeout(() => {
                chatPopup.classList.remove('d-none');

                // Hide after 5 seconds
                setTimeout(() => {
                    chatPopup.classList.add('fade-out');
                    // Remove from DOM/Display after animation
                    setTimeout(() => {
                        chatPopup.classList.add('d-none');
                        chatPopup.classList.remove('fade-out');
                    }, 500);
                }, 5000);
            }, 1000);
        }

        // Clicking the popup opens the chat
        chatPopup.addEventListener('click', () => {
            chatPopup.classList.add('d-none');
            toggleBtn.click();
        });

        // Toggle Chat Window
        toggleBtn.addEventListener('click', () => {
            chatWindow.classList.toggle('d-none');
            chatPopup.classList.add('d-none'); // Hide popup if opening chat
            if (!chatWindow.classList.contains('d-none')) {
                inputField.focus();
                scrollToBottom();
            }
        });

        closeBtn.addEventListener('click', () => {
            chatWindow.classList.add('d-none');
        });

        // Send Message Logic
        function sendMessage() {
            const message = inputField.value.trim();
            if (!message) return;

            // Add User Message
            addMessage(message, 'user');
            inputField.value = '';

            // Show Typing Indicator
            typingIndicator.classList.remove('d-none');
            scrollToBottom();

            // Prepare history (simplified: just last few messages from DOM or memory)
            // Ideally, we'd maintain a history array in JS
            const history = getChatHistory();

            // Call API
            fetch('/chatbot/api/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    message: message,
                    history: history
                })
            })
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    typingIndicator.classList.add('d-none');
                    addMessage(data.response, 'bot');
                })
                .catch(error => {
                    typingIndicator.classList.add('d-none');
                    addMessage("Sorry, I'm having trouble connecting right now.", 'bot');
                    console.error('Error:', error);
                });
        }

        sendBtn.addEventListener('click', sendMessage);

        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Helper: Add Message to DOM
        function addMessage(text, sender, avatarUrl = null) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', `${sender}-message`, 'mb-3', 'd-flex', 'align-items-end');

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content', 'p-2', 'px-3', 'rounded', 'shadow-sm');

            // Avatar for user
            if (sender === 'user') {
                const avatarImg = document.createElement('img');
                // Use passed avatarUrl or fallback to default
                avatarImg.src = avatarUrl || "{% static 'images/default_user.png' %}";
                // Fallback if the static image doesn't exist or specific url fails
                avatarImg.onerror = function () {
                    this.style.display = 'none';
                    // Create icon fallback
                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'rounded-circle bg-secondary d-flex align-items-center justify-content-center text-white me-2';
                    iconDiv.style.width = '30px';
                    iconDiv.style.height = '30px';
                    iconDiv.innerHTML = '<i class="fas fa-user" style="font-size: 12px;"></i>';
                    messageDiv.insertBefore(iconDiv, contentDiv.nextSibling);
                };

                avatarImg.classList.add('rounded-circle', 'me-2', 'shadow-sm');
                avatarImg.style.width = '30px';
                avatarImg.style.height = '30px';
                avatarImg.style.objectFit = 'cover';

                // User avatar goes AFTER content (right side)
                // But wait, flex-direction is row. User message is aligned right. 
                // We want text then avatar.
                // let's adjust CSS for user-message to be flex-row-reverse? or just append avatar last.
            }

            // Simple markdown-like parsing (bolding)
            const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');

            contentDiv.innerHTML = formattedText;

            const timeSmall = document.createElement('small');
            timeSmall.classList.add('text-muted', 'ms-1', 'd-block', 'text-end');
            timeSmall.style.fontSize = '0.7rem';
            timeSmall.innerText = 'Just now';

            const messageBody = document.createElement('div');
            messageBody.appendChild(contentDiv);
            messageBody.appendChild(timeSmall);

            if (sender === 'user') {
                // User: Message + Avatar
                // Check if we have a valid profile picture url from template context
                // User: Message + Avatar
                // Check if we have a valid profile picture url from template context
                const userProfilePic = "{% if user.profile.profile_picture %}{{ user.profile.profile_picture.url }}{% endif %}";

                if (userProfilePic) {
                    const img = document.createElement('img');
                    img.src = userProfilePic;
                    img.classList.add('rounded-circle', 'ms-2', 'shadow-sm', 'border');
                    img.style.width = '32px';
                    img.style.height = '32px';
                    img.style.objectFit = 'cover';
                    messageDiv.appendChild(messageBody);
                    messageDiv.appendChild(img);
                } else {
                    // Default icon if no image
                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'rounded-circle bg-light border d-flex align-items-center justify-content-center ms-2 text-secondary';
                    iconDiv.style.width = '32px';
                    iconDiv.style.height = '32px';
                    iconDiv.innerHTML = '<i class="fas fa-user"></i>';
                    messageDiv.appendChild(messageBody);
                    messageDiv.appendChild(iconDiv);
                }
                messageDiv.classList.add('justify-content-end');

            } else {
                // Bot: Avatar + Message
                const iconDiv = document.createElement('div');
                iconDiv.className = 'rounded-circle bg-primary d-flex align-items-center justify-content-center me-2 text-white';
                iconDiv.style.width = '32px';
                iconDiv.style.height = '32px';
                iconDiv.innerHTML = '<i class="fas fa-robot"></i>';

                messageDiv.appendChild(iconDiv);
                messageDiv.appendChild(messageBody);
                timeSmall.classList.remove('text-end');
            }

            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Helper: Scroll to Bottom
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Helper: Get CSRF Token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Helper: Get simple history for context (last 5 pairs)
        function getChatHistory() {
            // This is a simplified client-side history builder. 
            // Better to handle proper session history on server or robust client state.
            // For now, we return empty list to rely on single-turn context or server-side session if implemented later.
            // Using previous messages from DOM is complex due to formatting.
            return [];
        }
    });
</script>
